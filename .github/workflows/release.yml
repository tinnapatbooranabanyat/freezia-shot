# Builds Freezia and its installer on GitHub-hosted Windows runners.
#
# Code signing (SignPath Foundation) runs only when the repository variable SIGNPATH_ORGANIZATION_ID is set
# (Settings > Secrets and variables > Actions). Until then the workflow produces unsigned files.
#   variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG (default "freezia"),
#              SIGNPATH_SIGNING_POLICY_SLUG (default "release-signing")
#   secret:    SIGNPATH_API_TOKEN
# Artifact configurations to create in the SignPath project: .signpath/artifact-configurations/*.xml
#
# Signing happens in three rounds because each step needs the previous one signed:
#   1. OCR DLLs (Tesseract, Leptonica)  -> embedded into Freezia.exe
#   2. Freezia.exe + Inno Setup uninstaller -> packed into the installer
#   3. the installer
#
# Push a tag like v1.0.1 (matching <Version> in Freezia.csproj) to publish a GitHub release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
  SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'freezia' }}
  SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: release notes list the commits since the previous tag

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [xml]$p = Get-Content src/Freezia/Freezia.csproj
          $v = ($p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match <Version>$v</Version> in Freezia.csproj" }

      - name: Install Inno Setup
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          # pinned version (same as local builds); official download from the Inno Setup GitHub releases
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $f -UseBasicParsing
          $sig = Get-AuthenticodeSignature $f
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') {
            throw "Inno Setup download is not signed by its publisher ($($sig.Status) $($sig.SignerCertificate.Subject))"
          }
          Start-Process $f -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          Get-ChildItem "$env:ProgramFiles\Inno Setup*\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { "Installed: $($_.FullName)" }

      # ---------------------------------------------------------------- round 1: OCR DLLs

      - name: Collect OCR native DLLs
        run: |
          dotnet restore src/Freezia/Freezia.csproj
          $pkgs = (dotnet nuget locals global-packages --list) -replace '^global-packages:\s*', ''
          $src = Get-ChildItem (Join-Path $pkgs.Trim() 'tesseractocr') -Directory | Sort-Object Name | Select-Object -Last 1
          New-Item -ItemType Directory -Force ocr-natives | Out-Null
          Copy-Item (Join-Path $src.FullName 'x64\*.dll') ocr-natives
          Get-ChildItem ocr-natives | ForEach-Object { "$($_.Name)  $(($_ | Get-AuthenticodeSignature).Status)" }

      - name: Upload OCR DLLs for signing
        id: up-ocr
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-ocr-natives
          path: ocr-natives/*.dll
          if-no-files-found: error

      - name: Sign OCR DLLs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ocr-natives
          github-artifact-id: ${{ steps.up-ocr.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ocr-natives-signed

      - name: Publish Freezia.exe
        run: |
          $dir = if ($env:SIGN -eq 'true') { 'ocr-natives-signed' } else { 'ocr-natives' }
          ./build.ps1 -SkipInstaller -OcrNativeDir $dir

      # ---------------------------------------------------------------- round 2: app + uninstaller

      - name: Prepare uninstaller and collect files to sign
        if: env.SIGN == 'true'
        run: |
          ./build.ps1 -SkipPublish -SignedUninstallerDir uninstaller -PrepareUninstaller
          New-Item -ItemType Directory -Force to-sign-app | Out-Null
          Copy-Item artifacts/publish/Freezia.exe to-sign-app/
          # SignPath matches PE files by extension: sign the uninstaller as .exe, renamed back afterwards
          $u = Get-ChildItem uninstaller -Filter 'uninst-*.e32' | Select-Object -First 1
          Copy-Item $u.FullName (Join-Path 'to-sign-app' ($u.BaseName + '.exe'))
          Get-ChildItem to-sign-app

      - name: Upload app for signing
        id: up-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: to-sign-app/*
          if-no-files-found: error

      - name: Sign Freezia.exe and uninstaller
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.up-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: app-signed

      - name: Put signed files back
        if: env.SIGN == 'true'
        run: |
          Copy-Item app-signed/Freezia.exe artifacts/publish/Freezia.exe -Force
          $u = Get-ChildItem app-signed -Filter 'uninst-*.exe' | Select-Object -First 1
          Copy-Item $u.FullName (Join-Path 'uninstaller' ($u.BaseName + '.e32')) -Force
          foreach ($f in @('artifacts/publish/Freezia.exe', $u.FullName)) {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed: $($s.Status)" }
            "$f signed by $($s.SignerCertificate.Subject)"
          }

      # ---------------------------------------------------------------- installer (round 3)

      - name: Build installer
        run: |
          if ($env:SIGN -eq 'true') { ./build.ps1 -SkipPublish -SignedUninstallerDir uninstaller }
          else { ./build.ps1 -SkipPublish }
          $setup = Get-ChildItem artifacts -Filter 'Freezia-Setup-*.exe' | Select-Object -First 1
          New-Item -ItemType Directory -Force to-sign-installer | Out-Null
          Copy-Item $setup.FullName to-sign-installer/

      - name: Upload installer for signing
        id: up-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: to-sign-installer/*.exe
          if-no-files-found: error

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: installer-signed

      - name: Collect release files
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $from = if ($env:SIGN -eq 'true') { 'installer-signed' } else { 'to-sign-installer' }
          Copy-Item "$from/*.exe" release/
          Get-ChildItem release | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB  signature: $($s.Status)"
            if ($env:SIGN -eq 'true' -and $s.Status -ne 'Valid') { throw "$($_.Name) is not validly signed" }
          }
          # checksum file for the in-app updater (UpdateService also accepts GitHub's asset digest)
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)" | Set-Content -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }

          # "What's new": commit subjects since the previous release tag (shown in the app's update window)
          $prev = git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $changes = git log $range --no-merges --pretty=format:'%s' |
            Where-Object { $_ -and $_ -notmatch '^Release v?\d' } |
            Select-Object -First 30 | ForEach-Object { "- $_" }
          if (-not $changes) { $changes = @('- Maintenance release') }

          # release notes: say honestly whether this build is signed
          $policy = "https://github.com/$env:GITHUB_REPOSITORY#code-signing-policy"
          $signing = if ($env:SIGN -eq 'true') {
            "Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy]($policy)."
          } else {
            "This build is **not code-signed** yet. Code signing through the [SignPath Foundation](https://signpath.org) is being set up (see the [code signing policy]($policy)). Until then, Windows SmartScreen may warn and Smart App Control may block the installer."
          }
          @(
            "## What's new"
            $changes
            ''
            '## Install'
            'Download the `Freezia-Setup-*.exe` file below and run it (Windows 10 1809+ / Windows 11, x64).'
            'Freezia 1.0.1 and later also update themselves from inside the app.'
            ''
            $signing
          ) | Set-Content -Encoding utf8 notes.md
          Get-Content notes.md

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Freezia-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.sha256
          body_path: notes.md
